name: Bug report
description: Report a reproducible Open3D defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [core, cli, glb, qa, mcp, worker, provider, docs]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest public fixture and command.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Open3D / Python / OS / Blender / Unity / GPU
  - type: textarea
    id: artifacts
    attributes:
      label: Artifact or checkpoint IDs
      description: Never include API keys or private assets.
