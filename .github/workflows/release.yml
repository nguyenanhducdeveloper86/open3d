name: signed-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install production runtimes
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt
          timeout 180s sudo env DEBIAN_FRONTEND=noninteractive apt-get update
          timeout 300s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y blender bubblewrap imagemagick fonts-dejavu-core libegl1
      - name: Test production and core
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]' build
          sudo -E env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
          python -m compileall -q open3d_artist tests
      - name: Build release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm ci --prefix web
          npm run build --prefix web
          python scripts/build_release.py
      - name: Smoke release artifacts
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          python -m venv /tmp/open3d-release-smoke
          /tmp/open3d-release-smoke/bin/pip install --disable-pip-version-check release/open3d_artist-*.whl
          /tmp/open3d-release-smoke/bin/open3d --help
          tar -tzf "release/open3d-web-$GITHUB_REF_NAME.tar.gz" | grep -Fx web/index.html
          app_dir="$RUNNER_TEMP/open3d-artist-app-$GITHUB_REF_NAME"
          run_dir="$RUNNER_TEMP/open3d-production-run"
          tar -xzf "release/open3d-artist-app-$GITHUB_REF_NAME.tar.gz" -C "$RUNNER_TEMP"
          test -f "$app_dir/examples/watering-can/asset.yaml"
          test -f "$app_dir/workers/unity/Editor/Open3DValidator.cs"
          test -f "$app_dir/web/dist/index.html"
          (cd "$app_dir" && sudo -E env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 python -m open3d_artist production-run --brief examples/production-qualification/brief.json --output "$run_dir")
          (cd "$app_dir" && sudo -E env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 python -m open3d_artist validate "$run_dir")
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag --prerelease
          --title "Open3D Artist 0.1.0a1 (alpha)"
          --notes "Alpha distribution only. Production assets remain LOCAL_ONLY_NOT_APPROVED; external visual QA, Unity/provider validation, and production approval are not implied."
