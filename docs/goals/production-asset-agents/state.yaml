version: 2

goal:
  title: "Open3D production asset agents"
  slug: "production-asset-agents"
  kind: open_ended
  tranche: "Discover and complete successive safe verified slices until Open3D demonstrates the full production asset oracle."
  status: active
  oracle:
    signal: "A checked-in fixture runs from prompt/reference through Blender generation, six-view QA, approval, viewer load, and signed artifact metadata, with Codex and Claude Code agent receipts."
    cadence: "after each Worker package and at final audit"
    final_proof: "Passing end-to-end fixture commands, generated artifact/evidence files, viewer load check, agent adapter receipts, and final PM/Judge audit."
  intake:
    original_request: "Open3D must generate high-quality production assets like xFarm and integrate Codex/Claude Code agents like OpenDesign."
    interpreted_outcome: "Open3D becomes a production asset pipeline, not only a viewer: prompt/reference planning, deterministic Blender generation, multi-view QA, controlled repair, promotion, and agent access."
    input_shape: open_ended
    audience: "Open3D asset-production operator"
    authority: requested
    proof_type: artifact
    completion_proof: "A reproducible fixture produces approved .blend/.glb assets, six renders, QA/provenance evidence, viewer output, and agent receipts from the documented CLI/API."
    likely_misfire: "Implementing only a natural-language command box or a one-shot provider call without xFarm-style deterministic recipes, QA, evidence, and promotion."
    blind_spots_considered:
      - "Blender runtime and sandbox policy"
      - "External xFarm path and recipe compatibility"
      - "AI provider credentials, cost, and reproducibility"
      - "Codex and Claude Code CLI availability and permissions"
      - "Multi-view visual QA and bounded repair"
      - "Artifact promotion, provenance, and signed release trust"
    existing_plan_facts:
      - "Retain the current Blender sandbox, Unity validator, desktop viewer, AI-provider adapters, and signed-release workflow."
      - "Use /Users/ducna/Desktop/xFarm as the production workflow reference."
      - "Keep the GSAP dark design system and implementation simple."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  commit_and_push_after_worker: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: unknown
  worker: unknown
  judge: unknown

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/production-asset-agents/"
    command: "node /Users/ducna/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/production-asset-agents"

