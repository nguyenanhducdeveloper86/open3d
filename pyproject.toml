[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open3d-artist"
version = "0.1.0a1"
description = "A local, contract-first 3D asset pipeline for artists and agents."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Open3D contributors"}]
keywords = ["3d", "gltf", "glb", "blender", "mcp", "asset-pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["jsonschema>=4.20"]

[project.scripts]
open3d = "open3d_artist.cli:main"

[tool.setuptools.packages.find]
include = ["open3d_artist*"]
